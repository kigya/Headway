services:
  - type: web
    name: headway-home
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: docker/render/Home.Dockerfile
    dockerContext: server
    healthCheckPath: /internal/v1/home/healthz
    envVars:
      - key: ENV
        value: prod
      - key: HOME_SERVICE_SELF_HOST
        value: 0.0.0.0
      - key: HOME_ICONS_PUBLIC_BASE_URL
        sync: false
  - type: web
    name: headway-gateway
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: docker/render/Gateway.Dockerfile
    dockerContext: server
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: prod
      - key: GATEWAY_SERVICE_HOST
        value: 0.0.0.0
      - key: AUTH_SERVICE_HOST
        sync: false
      - key: AUTH_SERVICE_PORT
        sync: false
      - key: DATABASE_SERVICE_HOST
        sync: false
      - key: DATABASE_SERVICE_PORT
        sync: false
      - key: HOME_SERVICE_HOST
        fromService:
          name: headway-home
          type: web
          property: host
      - key: HOME_SERVICE_PORT
        fromService:
          name: headway-home
          type: web
          property: port
