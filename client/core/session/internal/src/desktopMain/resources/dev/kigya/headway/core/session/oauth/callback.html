<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111111;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 480px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.3;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.72);
        }
        .open-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 240px;
            padding: 14px 28px;
            background: #ffffff;
            color: #111111;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }
        .open-button:hover { opacity: 0.9; }
        .open-button:active { opacity: 0.8; }
        .fallback {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.48);
        }
        .fallback a {
            color: rgba(255, 255, 255, 0.72);
            text-decoration: underline;
        }
    </style>
    <script>
        {{CLOSE_TAB_SCRIPT}}
        var closeAttemptIntervalId = null;
        function openHeadwayAndClose(uri) {
            beginCloseWatch(30, 500);
            window.location.href = uri;
        }
        document.addEventListener("DOMContentLoaded", function() {
            var openButton = document.getElementById("open-headway-button");
            if (openButton) {
                openButton.addEventListener("click", function(event) {
                    event.preventDefault();
                    openHeadwayAndClose(openButton.getAttribute("href"));
                });
            }
        });
    </script>
</head>
<body>
<div class="content">
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
    <a class="open-button" id="open-headway-button" href="{{HEADWAY_URI}}">→ {{BUTTON_LABEL}}</a>
    <p class="fallback">
        Having trouble?
        <a id="open-headway-manually" href="{{FALLBACK_URI}}">Open Headway manually</a>
    </p>
</div>
</body>
</html>
