services:
  database:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: database
    env_file:
      - docker/${ENV:-dev}/env.common
      - docker/${ENV:-dev}/env.database
    ports:
      - "8082:8082"
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: auth
    env_file:
      - docker/${ENV:-dev}/env.common
      - docker/${ENV:-dev}/env.auth
    depends_on:
      - database
    ports:
      - "8081:8081"
    restart: "no"

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: admin
    env_file:
      - docker/${ENV:-dev}/env.common
      - docker/${ENV:-dev}/env.admin
    depends_on:
      - database
    ports:
      - "8083:8083"
    restart: "no"

  home:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: home
    env_file:
      - docker/${ENV:-dev}/env.common
      - docker/${ENV:-dev}/env.home
    ports:
      - "8084:8084"
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gateway
    env_file:
      - docker/${ENV:-dev}/env.common
      - docker/${ENV:-dev}/env.gateway
    depends_on:
      - auth
      - home
    ports:
      - "8080:8080"
    restart: "no"
