services:
  database:
    build:
      context: ..
      dockerfile: server/docker/Dockerfile
      target: database
    env_file:
      - docker/env.database
    ports:
      - "8082:8082"
    restart: "no"

  auth:
    build:
      context: ..
      dockerfile: server/docker/Dockerfile
      target: auth
    env_file:
      - docker/env.auth
    depends_on:
      - database
    ports:
      - "8081:8081"
    restart: "no"

  gateway:
    build:
      context: ..
      dockerfile: server/docker/Dockerfile
      target: gateway
    env_file:
      - docker/env.gateway
    depends_on:
      - auth
    ports:
      - "8080:8080"
    restart: "no"
