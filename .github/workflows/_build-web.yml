name: _build-web
on:
  workflow_call: {}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/gradle-build-action@v3

      - name: Set up Node (for Wasm toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn for Kotlin/Wasm)
        run: |
          corepack enable
          yarn --version

      - name: Build Web (Wasm/JS)
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY:  ${{ secrets.GPR_KEY }}
          GRADLE_OPTS: -Xmx4g
        run: |
          ./gradlew \
            --no-daemon \
            -Dorg.gradle.configuration-cache=false \
            :app:headwayWeb:wasmJsBrowserDistribution \
            --stacktrace \
            --info

      - name: Upload Web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            app/headwayWeb/build/dist/**
            app/headwayWeb/build/distributions/**
          if-no-files-found: warn
          retention-days: 14
