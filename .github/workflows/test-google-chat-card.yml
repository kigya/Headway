name: Test Google Chat Card

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
        default: "14"
      pr_title:
        description: "PR title"
        required: true
        default: "CLIENT-HEADWAY-13: Created Google Chat PR notifier job"
      pr_url:
        description: "PR url"
        required: true
        default: "https://github.com/kigya/Headway/pull/14"
      pr_author:
        description: "PR author"
        required: true
        default: "kigya"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Google Chat card
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ inputs.pr_url }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          payload=$(node - <<'NODE'
          const payload = {
            cardsV2: [{
              cardId: "pr-ci-success-test",
              card: {
                header: { title: "✅ Card test", subtitle: `Repo: ${process.env.REPO}` },
                sections: [{
                  widgets: [
                    { textParagraph: { text: `<b>PR #${process.env.PR_NUMBER}</b>: ${process.env.PR_TITLE}` } },
                    { textParagraph: { text: `<b>Author</b>: ${process.env.PR_AUTHOR}` } },
                    { buttonList: { buttons: [{ text: "Open PR", onClick: { openLink: { url: process.env.PR_URL } } }] } }
                  ]
                }]
              }
            }]
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          )
          curl -sS -X POST -H "Content-Type: application/json; charset=UTF-8" -d "$payload" "$WEBHOOK"
