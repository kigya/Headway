name: _build-web
on:
  workflow_call: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/gradle-build-action@v3

      - name: Prepare Kotlin/Wasm lock
        run: ./gradlew :app:headwayWeb:kotlinWasmUpgradeYarnLock --stacktrace

      - name: Build Web (Wasm/JS)
        run: ./gradlew :app:headwayWeb:wasmJsBrowserDistribution --stacktrace

      - name: Upload Web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            app/headwayWeb/build/dist/**
            app/headwayWeb/build/distributions/**
          if-no-files-found: warn
          retention-days: 14
