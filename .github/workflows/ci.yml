name: Headway Pipelines

on:
  pull_request:
    branches: [ trunk ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ true }}
    uses: ./.github/workflows/_build-android.yml
    secrets: inherit
  desktop:
    if: ${{ true }}
    uses: ./.github/workflows/_build-desktop.yml
    secrets: inherit
  web:
    if: ${{ true }}
    uses: ./.github/workflows/_build-web.yml
    secrets: inherit
  ios:
    if: ${{ true }}
    uses: ./.github/workflows/_build-ios.yml
    secrets: inherit
  detekt:
    if: ${{ true }}
    needs: [ android, desktop, web, ios ]
    uses: ./.github/workflows/_detekt.yml
    secrets: inherit
  notify_google_chat:
    if: ${{ true }}
    needs: [ android, desktop, web, ios, detekt ]
    uses: ./.github/workflows/_notify-google-chat.yml
    secrets:
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
