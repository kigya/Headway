name: _build-android
on:
  workflow_call: {}

jobs:
  build:
    name: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          generate-job-summary: true

      - name: Make gradlew executable
        run: chmod +x client/gradlew

      - name: Build Android
        working-directory: ./client
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY:  ${{ secrets.GPR_KEY }}
        run: ./gradlew :app:headwayAndroid:assembleDebug --stacktrace

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          path: |
            client/app/headwayAndroid/build/outputs/apk/**/*.apk
            client/app/headwayAndroid/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 14
