name: _notify-google-chat

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
      pr_title:
        type: string
        required: true
      pr_url:
        type: string
        required: true
      pr_author:
        type: string
        required: true
    secrets:
      GOOGLE_CHAT_WEBHOOK_URL:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Gate by label (do not notify twice)
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number("${{ inputs.pr_number }}");

            const { data } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const labels = data.map(l => l.name);

            core.setOutput("send", labels.includes("chat-notified") ? "false" : "true");

      - name: Send Google Chat card
        if: ${{ steps.gate.outputs.send == 'true' }}
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ inputs.pr_url }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          payload=$(node - <<'NODE'
          const payload = {
            cardsV2: [
              {
                cardId: "pr-ci-success",
                card: {
                  header: {
                    title: "✅ All checks passed",
                    subtitle: `Repo: ${process.env.REPO}`
                  },
                  sections: [
                    {
                      widgets: [
                        { textParagraph: { text: `<b>PR #${process.env.PR_NUMBER}</b>: ${process.env.PR_TITLE}` } },
                        { textParagraph: { text: `<b>Author</b>: ${process.env.PR_AUTHOR}` } },
                        {
                          buttonList: {
                            buttons: [
                              {
                                text: "Open PR",
                                onClick: { openLink: { url: process.env.PR_URL } }
                              }
                            ]
                          }
                        }
                      ]
                    }
                  ]
                }
              }
            ]
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          )

          curl -sS -X POST -H "Content-Type: application/json; charset=UTF-8" \
            -d "$payload" \
            "$WEBHOOK"

      - name: Mark PR as notified (add label)
        if: ${{ steps.gate.outputs.send == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ inputs.pr_number }}"),
              labels: ["chat-notified"]
            });
            
