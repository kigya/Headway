name: server
on:
  workflow_call: {}

jobs:
  build:
    if: ${{ true }}
    uses: ./.github/workflows/_build-server.yml
    secrets: inherit
  test:
    if: ${{ true }}
    uses: ./.github/workflows/_test-server.yml
    secrets: inherit
  detekt:
    if: ${{ true }}
    needs: [ build ]
    uses: ./.github/workflows/_detekt-server.yml
    secrets: inherit
