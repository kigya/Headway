name: _build-server
on:
  workflow_call: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          generate-job-summary: true

      - name: Make gradlew executable
        run: chmod +x server/gradlew

      - name: Build Database Microservice
        working-directory: ./server
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
        run: ./gradlew database:internal:installDist --stacktrace

      - name: Build Auth Microservice
        working-directory: ./server
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
        run: ./gradlew auth:internal:installDist --stacktrace

      - name: Build Gateway Microservice
        working-directory: ./server
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
        run: ./gradlew gateway:installDist --stacktrace

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build-outputs
          path: server/**/build/install/
          if-no-files-found: warn
          retention-days: 14
