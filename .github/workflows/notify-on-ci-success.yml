name: Notify Google Chat on CI success

on:
  workflow_run:
    workflows: ["Headway Pipelines"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Get PR for this workflow run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              core.setOutput("skip", "true");
              return;
            }
            core.setOutput("skip", "false");
            core.setOutput("number", String(prs[0].number));

      - name: Load PR details
        if: ${{ steps.pr.outputs.skip == 'false' }}
        id: prdata
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number("${{ steps.pr.outputs.number }}");

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

            core.setOutput("number", String(pr.number));
            core.setOutput("title", pr.title);
            core.setOutput("url", pr.html_url);
            core.setOutput("author", pr.user.login);
            core.setOutput("draft", pr.draft ? "true" : "false");

      - name: Gate by label (do not notify twice)
        if: ${{ steps.pr.outputs.skip == 'false' && steps.prdata.outputs.draft != 'true' }}
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number("${{ steps.prdata.outputs.number }}");

            const { data } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const labels = data.map(l => l.name);

            core.setOutput("send", labels.includes("chat-notified") ? "false" : "true");

      - name: Send message to Google Chat
        if: ${{ steps.gate.outputs.send == 'true' }}
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ steps.prdata.outputs.url }}
          PR_TITLE: ${{ steps.prdata.outputs.title }}
          PR_AUTHOR: ${{ steps.prdata.outputs.author }}
          PR_NUMBER: ${{ steps.prdata.outputs.number }}
        run: |
          text="✅ All checks passed\nRepo: ${REPO}\nPR #${PR_NUMBER}: ${PR_TITLE}\nAuthor: ${PR_AUTHOR}\n${PR_URL}"
          payload=$(node -e 'const fs=require("fs"); const t=fs.readFileSync(0,"utf8"); process.stdout.write(JSON.stringify({text:t}))' <<< "$text")
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"

      - name: Mark PR as notified (add label)
        if: ${{ steps.gate.outputs.send == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.prdata.outputs.number }}"),
              labels: ["chat-notified"]
            });
