name: Notify Google Chat on CI success

on:
  workflow_run:
    workflows: ["Headway Pipelines"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

jobs:
  prepare:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      number: ${{ steps.prdata.outputs.number }}
      title: ${{ steps.prdata.outputs.title }}
      url: ${{ steps.prdata.outputs.url }}
      author: ${{ steps.prdata.outputs.author }}
      draft: ${{ steps.prdata.outputs.draft }}

    steps:
      - name: Get PR for this workflow run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              core.setOutput("skip", "true");
              return;
            }
            core.setOutput("skip", "false");
            core.setOutput("number", String(prs[0].number));

      - name: Load PR details
        if: ${{ steps.pr.outputs.skip == 'false' }}
        id: prdata
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number("${{ steps.pr.outputs.number }}");

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

            core.setOutput("number", String(pr.number));
            core.setOutput("title", pr.title);
            core.setOutput("url", pr.html_url);
            core.setOutput("author", pr.user.login);
            core.setOutput("draft", pr.draft ? "true" : "false");

  notify:
    needs: prepare
    if: ${{ needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.draft != 'true' }}
    uses: ./.github/workflows/_notify-google-chat.yml
    with:
      pr_number: ${{ fromJSON(needs.prepare.outputs.number) }}
      pr_title: ${{ needs.prepare.outputs.title }}
      pr_url: ${{ needs.prepare.outputs.url }}
      pr_author: ${{ needs.prepare.outputs.author }}
    secrets:
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
