name: _build-desktop
on:
  workflow_call: {}

jobs:
  build:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packaging deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Ensure WiX Toolset (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco upgrade wixtoolset -y --no-progress --allow-downgrade
          $wixDir = (Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset*" -Directory |
                     Sort-Object Name -Descending | Select-Object -First 1).FullName
          if ($wixDir) {
            $wixBin = Join-Path $wixDir "bin"
            if (Test-Path $wixBin) {
              echo $wixBin >> $env:GITHUB_PATH
              # на всякий случай ещё переменная окружения WIX
              echo "WIX=$wixBin" >> $env:GITHUB_ENV
            }
          }

      - name: Package Desktop (${{ matrix.os }})
        uses: gradle/gradle-build-action@v3
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY:  ${{ secrets.GPR_KEY }}
        with:
          arguments: :app:headwayDesktop:packageDistributionForCurrentOS --stacktrace

      - name: Upload Desktop distributions (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist-${{ matrix.os }}
          path: app/headwayDesktop/build/compose/binaries/**
          if-no-files-found: warn
          retention-days: 14
